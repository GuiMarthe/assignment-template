title: Assignment PDF
author: Guilherme Marthe
version: 1.0.0
quarto-required: ">=1.4.0"
contributes:
  formats:
    pdf:
      pdf-engine: xelatex
      highlight-style: github
      code-block-bg: "#f7f7f7"
      code-block-border-left: true
      shift-heading-level-by: 2
      fig-pos: "H"
      fig-cap-location: top
      geometry:
        - top=0.8in
        - right=.6in
        - bottom=0.8in
        - left=.6in
      link-citations: true
      colorlinks: true
      linkcolor: blue
      include-in-header:
        - header.tex
